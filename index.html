<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>वेदश्री वैदिक पंचांग</title>
<style>
:root{--m:#8b0b12;--m2:#b3141b;--g:#d9a21b;--cr:#fff4dc;--tx:#2b1608;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:#e8731a}body{margin:0;background:linear-gradient(#fbb04a,#f08a24 40%,#c2410c);font-family:"Noto Sans Devanagari",system-ui,sans-serif;color:var(--tx)}
.app{max-width:560px;margin:auto;padding:8px 10px 20px}
.logo{width:100%;display:block;margin:0 auto 4px}
.ctl{background:var(--cr);border:2px solid var(--g);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-weight:700;font-size:14px}
.ctl summary{cursor:pointer;color:var(--m)}.ctl label{display:block;font-size:13px;margin:8px 0 3px;color:#7c5a40}
.ctl input,.ctl select{width:100%;padding:9px;border:1px solid #e3c27a;border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
.ctl button{margin:8px 6px 0 0;padding:9px 12px}
button{border:0;border-radius:12px;padding:11px 8px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(#c21d24,#7a0b12);box-shadow:0 2px 0 #5a070c;cursor:pointer}
button.gd{background:linear-gradient(#ffd24d,#e59a07);color:#5a2a00;box-shadow:0 2px 0 #a86a00}button.cm{background:#fff4dc;color:var(--tx);box-shadow:0 0 0 1.5px #e3c27a inset}
.hd{position:relative;height:236px;border:3px solid var(--g);border-radius:16px;overflow:hidden;background:linear-gradient(#f9a43f,#fdd9a1 70%,#ffe6bd);text-align:center}
.hd img{position:absolute;top:0;height:100%;width:auto}
.hd .l{left:0;-webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
.hd .r{right:0;-webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
.hd .c{position:relative;padding-top:6px}.t1{font-size:31px;font-weight:800;color:var(--m);line-height:1.15;text-shadow:0 1px 0 #fff6}.t1 b{color:#c2410c;font-size:22px}
.rb{display:inline-block;min-width:150px;margin:5px 0;padding:3px 22px;border-radius:30px;border:2px solid var(--g);font-weight:800}
.rb.a{background:linear-gradient(#b3141b,#6d0910);color:#fff;font-size:28px}.rb.b{background:linear-gradient(#fff8e1,#ffe7a8);color:var(--tx);font-size:21px}
.sk{font-weight:800;font-size:15px;margin-top:6px}
.cd{background:linear-gradient(#fff9ec,#ffedc9);border:3px solid var(--g);border-radius:16px;padding:10px;margin-top:10px}
.ttl{display:block;width:fit-content;margin:-22px auto 8px;padding:4px 26px;border-radius:30px;border:2px solid var(--g);background:linear-gradient(#b3141b,#6d0910);color:#fff;font-weight:800;font-size:21px}
.gr{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #f0d9a8}
.it{display:flex;gap:7px;align-items:center;padding:7px 5px;border-bottom:1px solid #f0d9a8}.it:nth-child(odd){border-right:1px solid #f0d9a8}
.ic{flex:none;width:34px;height:34px;border-radius:9px;background:linear-gradient(#ffe39a,#f3b73a);display:grid;place-items:center;font-size:18px}
.it small{display:block;color:var(--m);font-weight:800;font-size:13px}.it span{display:block;font-weight:700;font-size:14px;line-height:1.25}.it em{display:block;font-style:normal;font-size:11.5px;color:#5b4430}
.sq{text-align:center;font-weight:700;font-size:16px;line-height:1.85;padding:4px 2px}.sq i{font-style:normal;color:var(--m2)}
.bt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.bt button{font-size:12.5px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wk div{border-radius:8px;overflow:hidden;background:#fff;text-align:center;font-size:10.5px;font-weight:700;border:1px solid #e3c27a}
.wk div b{display:block;color:#fff;padding:3px 0;font-size:11px}.wk div p{margin:0;padding:3px 1px;line-height:1.35;color:#7a1b10}.wk .on{outline:3px solid var(--m);outline-offset:-1px}
.ft{font-size:11.5px;color:#fff;text-align:center;margin-top:12px;line-height:1.5}#msg{font-size:12px;color:#7a1b10;margin-top:4px}
</style></head><body><div class="app">

const dev=s=>String(s).replace(/\d/g,d=>'०१२३४५६७८९'[d]);
function jd0(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunL(j){const d=j-2451545,g=(357.528+.9856003*d)*R;return mod(280.46+.9856474*d+1.915*Math.sin(g)+.02*Math.sin(2*g),360)}
function moonL(j){const d=j-2451545,L=218.316+13.176396*d,M=(134.963+13.064993*d)*R,D=(297.85+12.190749*d)*R,g=(357.528+.9856003*d)*R,F=(93.272+13.22935*d)*R;
return mod(L+6.289*Math.sin(M)+1.274*Math.sin(2*D-M)+.658*Math.sin(2*D)+.214*Math.sin(2*M)-.186*Math.sin(g)-.114*Math.sin(2*F)-.059*Math.sin(2*D-2*M)-.057*Math.sin(2*D-M+g)+.053*Math.sin(2*D+M)+.046*Math.sin(2*D-g)+.041*Math.sin(M-g),360)}
const ayan=j=>23.853+(j-2451545)/365.25*.013972,N27=360/27;
function st(j){const s=sunL(j),m=moonL(j),a=ayan(j),e=mod(m-s,360),sm=mod(m-a,360),ss=mod(s-a,360);
return{e,sm,ss,t:Math.floor(e/12),n:Math.floor(sm/N27),y:Math.floor(mod(sm+ss,360)/N27),k:Math.floor(e/6)}}
function endOf(j,key){const c=st(j)[key];let a=j,b=j;for(let i=0;i<200;i++){b=a+1/96;if(st(b)[key]!==c)break;a=b}
for(let i=0;i<22;i++){const m=(a+b)/2;st(m)[key]===c?a=m:b=m}return b}
function sun(y,m,d,lat,lon){const N=Math.round((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/864e5),B=2*Math.PI*(N-81)/364,

function fmt(h){const nx=h>=24,x=mod(h,24);let hh=Math.floor(x),mi=Math.round((x-hh)*60);if(mi==60){mi=0;hh++}
const p=hh<4?'रात्री':hh<12?'सकाळी':hh<16?'दुपारी':hh<19?'सायं.':'रात्री';return(nx?'उद्या ':'')+p+' '+dev(hh%12||12)+':'+dev(String(mi).padStart(2,'0'))}
const rng=(a,b)=>fmt(a)+' – '+fmt(b);
function calc(y,m,d,lat,lon){const[sr,nn,ss]=sun(y,m,d,lat,lon),J=jd0(y,m,d),toJ=h=>J+(h-5.5)/24,toH=j=>(j-J)*24+5.5,

const nm=q=>{let j=q;for(let i=0;i<6;i++){let e=st(j).e;if(e>180)e-=360;j-=e/12.1907}return j};let j=nm(jr);if(j>jr)j=nm(j-29.53);
const sign=Math.floor(st(j).ss/30),mi=(sign+1)%12,pk=S.t<15?'शुक्ल':'कृष्ण',tn=S.t==14?'पौर्णिमा':S.t==29?'अमावस्या':TI[S.t%15];
const sh=y-78-(mi>=8&&m<=4?1:0),sp={10:'एकादशी',25:'एकादशी',14:'पौर्णिमा',29:'अमावस्या',3:'विनायक चतुर्थी',18:'संकष्टी चतुर्थी',12:'प्रदोष',27:'प्रदोष'}[S.t]||'';
const dl=(ss-sr)/15,ab=sr+dl*7;
return{x:{S,mi,pk,tn,wd,sh,jr},date:dev(d)+' '+GM[m-1]+' '+dev(y),wd:WD[wd],top:'शके '+dev(sh)+' • '+MN[mi]+' '+pk+' पक्ष',sp,
rows:[['तिथी',pk+' '+tn+' · '+fmt(toH(endOf(jr,'t')))+' पर्यंत'],['नक्षत्र',NK[S.n]+' · '+fmt(toH(endOf(jr,'n')))+' पर्यंत'],['योग',YG[S.y]],
['करण',S.k==0?'किंस्तुघ्न':S.k>56?['शकुनी','चतुष्पाद','नाग'][S.k-57]:KR[(S.k-1)%7]],['चंद्र रास',RS[Math.floor(S.sm/30)]],
['सूर्योदय / सूर्यास्त',fmt(sr)+' / '+fmt(ss)],['राहुकाळ',seg8(RAHU[wd])],['यमगंड',seg8(YAMA[wd])],['गुलिक',seg8(GUL[wd])],['अभिजित मुहूर्त',rng(ab,ab+dl)]]}}

function jup(j){const d=j-2451543.5,r=Math.PI/180,sn=x=>Math.sin(x*r),cs=x=>Math.cos(x*r);
const kep=(M,e)=>{let E=M+e/r*sn(M)*(1+e*cs(M));for(let i=0;i<4;i++)E-=(E-e/r*sn(E)-M)/(1-e*cs(E));return E};
const Ms=356.047+.9856002585*d,es=.016709-1.151e-9*d,ws=282.9404+4.70935e-5*d,Es=kep(mod(Ms,360),es),xv=cs(Es)-es,yv=Math.sqrt(1-es*es)*sn(Es),ls=mod(Math.atan2(yv,xv)/r+ws,360),rs=Math.hypot(xv,yv),xs=rs*cs(ls),ys=rs*sn(ls);
const N=100.4542+2.76854e-5*d,i=1.303-1.557e-7*d,w=273.8777+1.64505e-5*d,a=5.20256,e=.048498+4.469e-9*d,M=mod(19.895+.0830853001*d,360),E=kep(M,e),x=a*(cs(E)-e),y=a*Math.sqrt(1-e*e)*sn(E),v=Math.atan2(y,x)/r,rr=Math.hypot(x,y),u=v+w;
const xh=rr*(cs(N)*cs(u)-sn(N)*sn(u)*cs(i)),yh=rr*(sn(N)*cs(u)+cs(N)*sn(u)*cs(i)),Mj=M,Msat=316.967+.0334442282*d;

lon+=-.332*sn(2*Mj-5*Msat-67.6)-.056*sn(2*Mj-2*Msat+21)+.042*sn(3*Mj-5*Msat+21)-.036*sn(Mj-2*Msat)+.022*cs(Mj-Msat)+.023*sn(2*Mj-3*Msat+52)-.016*sn(Mj-5*Msat-69);

const SAM=['प्रभव','विभव','शुक्ल','प्रमोद','प्रजापति','अंगिरा','श्रीमुख','भाव','युवा','धाता','ईश्वर','बहुधान्य','प्रमाथी','विक्रम','वृष','चित्रभानु','स्वभानु','तारण','पार्थिव','व्यय','सर्वजित्','सर्वधारी','विरोधी','विकृती','खर','नंदन','विजय','जय','मन्मथ','दुर्मुख','हेमलंबी','विलंबी','विकारी','शार्वरी','प्लव','शुभकृत','शोभकृत','क्रोधी','विश्वावसु','पराभव','प्लवंग','कीलक','सौम्य','साधारण','विरोधकृत','परिधावी','प्रमादी','आनंद','राक्षस','नल','पिंगल','कालयुक्त','सिद्धार्थी','रौद्र','दुर्मती','दुंदुभी','रुधिरोद्गारी','रक्ताक्षी','क्रोधन','क्षय'];

P.sunR=sr;P.moonR=mr;P.jupR=jr_;

['',P.rows[1][1].split(' · ')[0],' शुभनक्षत्रे । ',P.rows[2][1],' शुभयोगे । ',kr,' शुभकरणे ।'],

const $=i=>document.getElementById(i),WS=[['रविवार','रविवासर','भानुवासर','#e53935'],['सोमवार','सोमवासर','इन्दुवासर','#546e7a'],['मंगळवार','मंगलवासर','भौमवासर','#d81b60'],['बुधवार','बुधवासर','सौम्यवासर','#2e7d32'],['गुरुवार','गुरुवासर','बृहस्पतिवासर','#f9a825'],['शुक्रवार','शुक्रवासर','भृगुवासर','#1e88e5'],['शनिवार','शनिवासर','मन्दवासर','#6a1b9a']];
let L=CITIES.slice(),P=null;

const txt=a=>a.join('');

$('msg').textContent=''}catch(e){$('msg').textContent='त्रुटी: '+e.message}}
['dt','ct'].forEach(i=>$(i).addEventListener('input',go));$('up').onclick=()=>{today();go()};
const sank=()=>P.sank.map(txt).join('\n');
$('cp').onclick=async()=>{const t=sank();try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}$('cp').textContent='✔ कॉपी झाले';setTimeout(()=>$('cp').textContent='📋 संकल्प कॉपी करा',1800)};

const u=new SpeechSynthesisUtterance(sank().replace(/[ॐ।॥]/g,' ')),v=s.getVoices().find(v=>/^(mr|hi)/i.test(v.lang));u.lang=v?v.lang:'hi-IN';if(v)u.voice=v;u.rate=.8;u.onend=()=>$('sp').textContent='🔊 संकल्प ऐका';$('sp').textContent='⏹ थांबवा';s.speak(u)};
